<style>
/* Layout: navy handheld-style top bar over a full-bleed pixel meadow (65% sky and hills, 35% walking ground split into 5 depth lanes). Single deliberate look: a bright game screen. */
:root {
  --ink: #1b1f3b;
  --ink-deep: #0b0e22;
  --paper: #eaf0dc;
  --paper-2: #cfdab9;
  --gold: #ffcb05;
  --gold-deep: #a97f00;
  --dex-red: #dc0a2d;
  --dex-red-deep: #8f0620;
  --blue: #3b4cca;
  --muted: #566086;
  --font-display: 'Press Start 2P', 'Courier New', monospace;
  --font-body: 'VT323', 'Courier New', monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  margin: 0;
  overflow: hidden;
  background: var(--ink-deep);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 1.2;
}
button, input { font-family: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar {
  position: relative;
  z-index: 500;
  flex: 0 0 auto;
  background: var(--ink);
  border-bottom: 4px solid var(--gold);
}
.bar-in {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 24px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: 0 0 auto; width: 34px; height: 34px; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 12px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--gold);
  text-wrap: balance;
}
.brand p { margin: 2px 0 0; font-size: 18px; color: #9fa8d8; }
.picker { display: flex; align-items: flex-start; gap: 12px; flex: 1 1 300px; min-width: 0; max-width: 580px; margin-left: auto; }
.combo { position: relative; flex: 1 1 auto; min-width: 0; }
#search {
  box-sizing: border-box;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font-size: 23px;
  color: var(--ink);
  background: var(--paper);
  border: 3px solid var(--ink-deep);
  border-radius: 0;
  box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.14);
  outline: none;
}
#search::placeholder { color: var(--muted); }
#search:focus-visible { box-shadow: 0 0 0 3px var(--gold), inset 0 3px 0 rgba(0, 0, 0, 0.14); }
#dexlist {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  z-index: 600;
  max-height: min(320px, 46vh);
  margin: 0;
  padding: 0;
  overflow-y: auto;
  list-style: none;
  background: var(--paper);
  border: 3px solid var(--ink-deep);
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
}
#dexlist li { display: flex; align-items: baseline; gap: 12px; padding: 6px 12px; font-size: 22px; color: var(--ink); cursor: pointer; }
#dexlist li .n { min-width: 3.4ch; font-size: 19px; color: var(--muted); font-variant-numeric: tabular-nums; }
#dexlist li.cur::after { content: ""; align-self: center; width: 8px; height: 8px; margin-left: auto; background: var(--dex-red); }
#dexlist li.active { background: var(--blue); color: #fff; }
#dexlist li.active .n { color: #cdd4ff; }
#dexlist li.none { cursor: default; color: var(--muted); }
.btn {
  flex: 0 0 auto;
  height: 44px;
  padding: 0 16px;
  font-family: var(--font-display);
  font-size: 11px;
  line-height: 1;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--gold);
  border: 3px solid var(--ink-deep);
  border-radius: 0;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--gold-deep), 0 4px 0 3px var(--ink-deep);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep), 0 1px 0 3px var(--ink-deep); }
.btn:disabled, .btn:disabled:active { color: #8089b0; background: #3a4066; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 #262b4c, 0 4px 0 3px var(--ink-deep); }
.btn:focus-visible, .x:focus-visible, .pet:focus-visible { outline: 3px dashed #fff; outline-offset: 3px; }
.btn.ghost { background: var(--paper); box-shadow: 0 4px 0 var(--paper-2), 0 4px 0 3px var(--ink-deep); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--paper-2), 0 1px 0 3px var(--ink-deep); }
.btn.danger { color: #fff; background: var(--dex-red); box-shadow: 0 4px 0 var(--dex-red-deep), 0 4px 0 3px var(--ink-deep); }
.btn.danger:active { box-shadow: 0 1px 0 var(--dex-red-deep), 0 1px 0 3px var(--ink-deep); }

/* habitat */
#habitat { position: relative; flex: 1 1 auto; min-height: 360px; overflow: hidden; isolation: isolate; background: #5db6f2; }
#bg { position: absolute; z-index: 0; inset: 0; display: block; width: 100%; height: 100%; }
#pets { position: absolute; z-index: 5; inset: 0; overflow: hidden; pointer-events: none; }
.pet { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: auto; cursor: pointer; will-change: transform; outline: none; -webkit-tap-highlight-color: transparent; }
.pet .body { position: absolute; left: 0; top: 0; min-width: 48px; min-height: 48px; transform-origin: 50% 100%; transform: translate(-50%, -100%) scale(var(--s, 1)); }
.pet .shadow { position: absolute; z-index: 0; left: 50%; bottom: -3px; width: 72%; height: 10px; transform: translateX(-50%); background: rgba(14, 54, 22, 0.34); border-radius: 50%; }
.pet img { position: relative; z-index: 1; display: block; box-sizing: border-box; min-width: 48px; min-height: 48px; object-fit: contain; image-rendering: pixelated; transform: scaleX(-1); user-select: none; -webkit-user-drag: none; }
.pet:hover img, .pet:focus-visible img {
  filter: brightness(1.12) drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff);
}
.pet .tag {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 100%;
  padding: 0 0.4em;
  font-size: calc(21px / var(--s, 1));
  line-height: 1.25;
  white-space: nowrap;
  color: var(--paper);
  background: var(--ink);
  border: 2px solid var(--ink-deep);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 0);
}
.pet:hover .tag, .pet:focus-visible .tag { opacity: 1; }
.hud {
  position: absolute;
  z-index: 2000;
  top: 12px;
  right: max(12px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 6px;
  padding: 8px 12px;
  font-family: var(--font-display);
  font-size: 10px;
  line-height: 1.3;
  color: var(--paper);
  background: rgba(27, 31, 59, 0.9);
  border: 3px solid var(--ink-deep);
}
.hud b { font-weight: 400; color: var(--gold); font-variant-numeric: tabular-nums; }
.hud span { font-family: var(--font-body); font-size: 17px; color: #9fa8d8; }
.hint {
  position: absolute;
  z-index: 2000;
  top: 22%;
  left: 50%;
  box-sizing: border-box;
  width: min(430px, calc(100% - 32px));
  padding: 14px 16px;
  color: var(--ink);
  background: var(--paper);
  border: 4px solid var(--ink-deep);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.3);
  transform: translateX(-50%);
}
.hint h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 11px; line-height: 1.5; font-weight: 400; color: var(--dex-red); }
.hint p { margin: 0; font-size: 22px; }
#toast {
  position: fixed;
  z-index: 300;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  max-width: calc(100% - 32px);
  padding: 10px 14px;
  font-family: var(--font-display);
  font-size: 10px;
  line-height: 1.5;
  color: var(--gold);
  background: var(--ink);
  border: 3px solid var(--ink-deep);
  box-shadow: 0 0 0 2px var(--gold);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 8px);
  transition: opacity 0.18s steps(3), transform 0.18s steps(3);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* modal */
.overlay {
  position: fixed;
  z-index: 200;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  background: rgba(11, 14, 34, 0.74);
}
.dex {
  box-sizing: border-box;
  width: min(560px, 100%);
  max-height: 100%;
  overflow-y: auto;
  color: var(--ink);
  background: var(--paper);
  border: 4px solid var(--ink-deep);
  box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.35);
  animation: pop 0.18s steps(3);
}
@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dex-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font-family: var(--font-display); font-size: 11px; color: #fff; background: var(--dex-red); border-bottom: 4px solid var(--ink-deep); }
.led { flex: 0 0 auto; width: 20px; height: 20px; background: #5ad7ff; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 3px var(--ink-deep); }
.x { margin-left: auto; width: 34px; height: 34px; padding: 0; font-family: var(--font-display); font-size: 12px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink-deep); border-radius: 0; cursor: pointer; }
.dex-body { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
.stage {
  box-sizing: border-box;
  flex: 1 1 220px;
  min-width: 0;
  max-width: 320px;
  aspect-ratio: 1 / 1;
  padding: 8px;
  border: 3px solid var(--ink-deep);
  background-color: var(--paper-2);
  background-color: color-mix(in srgb, var(--tc, #a8a878) 38%, #ffffff);
  background-image:
    linear-gradient(45deg, rgba(255, 255, 255, 0.3) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.3) 75%),
    linear-gradient(45deg, rgba(255, 255, 255, 0.3) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.3) 75%);
  background-size: 24px 24px;
  background-position: 0 0, 12px 12px;
}
.stage img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: 0; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.18)); transition: opacity 0.2s steps(4); }
.stage img.ready { opacity: 1; }
.stage img.pix { image-rendering: pixelated; }
.info { display: flex; flex: 1 1 200px; flex-direction: column; gap: 10px; min-width: 0; }
.no { margin: 0; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
.info h2 { margin: 0; font-family: var(--font-display); font-size: clamp(15px, 4.4vw, 20px); line-height: 1.35; font-weight: 400; color: var(--ink); text-wrap: balance; overflow-wrap: anywhere; }
.types { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-block; padding: 7px 10px 6px; font-family: var(--font-display); font-size: 10px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; border: 3px solid var(--ink-deep); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); }
.stats { display: grid; gap: 4px; margin: 6px 0 0; }
.stats div { display: flex; justify-content: space-between; gap: 12px; padding-top: 4px; border-top: 3px dashed var(--paper-2); font-size: 22px; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-variant-numeric: tabular-nums; }
.dex-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; padding: 0 16px 20px; }

@media (max-width: 520px) {
  .brand h1 { font-size: 11px; }
  .picker { flex-basis: 100%; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .dex { animation: none; }
  #toast, .stage img { transition: none; }
}
</style>

    var i, x, y;

    /* sky bands with a two-row dither at each seam */
    var skies = ['#4aa8ee', '#5db6f2', '#79c4f5', '#94d1f7', '#b0def9', '#c9e9fb'];
    var band = GTB / skies.length;

      px(x, GTB - 12, 3, 1, '#e9c690');

    /* ground, five depth lanes */
    var GHB = BH - GTB;
    var laneCols = ['#6cbf48', '#73c74e', '#7bcf55', '#83d65d', '#8cdd66'];
    for (i = 0; i < 5; i++) {
      var ly0 = GTB + Math.round(i * GHB / 5), ly1 = GTB + Math.round((i + 1) * GHB / 5);

    }
    px(0, GTB, BW, 2, '#4f9a3a');
    for (i = 1; i < 5; i++) {
      var lb = GTB + Math.round(i * GHB / 5);

    for (i = 0; i < 5; i++) {

      .then(function (j) {
        clearTimeout(to);
        if (!j || !Array.isArray(j.results) || j.results.length !== 151) return;
        j.results.forEach(function (r) {
          var id = parseInt(String(r.url).split('/').filter(Boolean).pop(), 10);
          if (id >= 1 && id <= 151 && typeof r.name === 'string') dex[id - 1].name = pretty(r.name);
        });
        liveDex = true;
        pets.forEach(function (p) {
          var nm = dex[p.rec.id - 1].name;
          p.tag.textContent = nm;
          p.el.setAttribute('aria-label', 'Inspect ' + nm);
        });
        dex.forEach(function (d, i) { select.options[i + 1].textContent = d.name; });
        if (listEl.hidden) input.value = sel ? sel.name : '';
        updateHud();
      })
      .catch(function () { clearTimeout(to); });
  }

  /* ---------- sizing ---------- */
  function measure() {
    var r = habitat.getBoundingClientRect();
    var nw = Math.max(1, Math.floor(r.width)), nh = Math.max(1, Math.floor(r.height));
    if (nw === W && nh === H) return;
    W = nw; H = nh;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    bgc.width = Math.round(W * DPR);
    bgc.height = Math.round(H * DPR);
    buildScene();
    GT = GTB * PXS;
    GH = Math.max(1, H - GT);
    pets.forEach(layoutPet);
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function frame(now) {
    if (!W || !H) measure();
    var dt = Math.min(64, now - last) / 16.667;
    last = now;
    paint(dt);
    for (var i = 0; i < pets.length; i++) {
      var p = pets[i];
      var target = (p.paused || p.hover) ? 0 : p.rec.speed;
      p.cur += (target - p.cur) * Math.min(1, 0.18 * dt);
      if (target === 0 && p.cur < 0.01) p.cur = 0;
      p.x += p.cur * dt;
      if (p.x - p.w / 2 > W + 8) p.x = -p.w / 2 - 8 - Math.random() * 80;
      p.el.style.transform = 'translate3d(' + p.x.toFixed(2) + 'px,' + p.y.toFixed(2) + 'px,0)';
    }
    requestAnimationFrame(frame);
  }

  /* ---------- boot ---------- */
  measure();
  try { localStorage.removeItem('pokemon-habitat-roster-v1'); } catch (e) { /* old starter data cleared when possible */ }
  var saved = loadRoster() || [];
  saved.forEach(function (rec) { addPet(rec); });
  save();
  updateHud();
  if (typeof ResizeObserver === 'function') new ResizeObserver(measure).observe(habitat);
  window.addEventListener('resize', measure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  syncDex();
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
